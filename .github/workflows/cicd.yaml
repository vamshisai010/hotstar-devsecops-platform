name: SecureFlow-CICD-Pipeline

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:

  build-scan-push-deploy:

    runs-on: ubuntu-latest

    steps:

    # Checkout Repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Setup NodeJS
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # Install Dependencies
    - name: Install Dependencies
      run: npm install

    # Build React Application
    - name: Build Application
      run: npm run build

    # DockerHub Login
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker Image
    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:${{ github.run_number }} \
        -t ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:latest .

    # Trivy Security Scan
    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:${{ github.run_number }}
        format: table
        exit-code: 0
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # Push Docker Images
    - name: Push Docker Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:latest

    # Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: latest

    # Configure kubeconfig
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name ${{ secrets.EKS_CLUSTER_NAME }}

    # Replace Image Tag in Kubernetes Deployment
    - name: Update Kubernetes Deployment Image
      run: |
        sed -i "s|IMAGE_TAG|${{ github.run_number }}|g" K8S/deployment.yml

    # Deploy to EKS
    - name: Deploy Application to EKS
      run: |
        kubectl apply -f K8S/deployment.yml
        kubectl apply -f K8S/service.yml

    # Verify Deployment
    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/hotstar-devsecops

    # List Pods
    - name: Get Pods
      run: |
        kubectl get pods -o wide

    # List Services
    - name: Get Services
      run: |
        kubectl get svc

    # Success Message
    - name: Deployment Successful
      run: |
        echo "Application deployed successfully to Amazon EKS"
