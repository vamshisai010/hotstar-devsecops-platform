apiVersion: apps/v1
kind: Deployment

metadata:
  name: hotstar-devsecops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hotstar-devsecops

  template:
    metadata:
      labels:
        app: hotstar-devsecops

    spec:
      containers:
      - name: hotstar-devsecops

        image: vamshisai010/hotstar-devsecops-platform:latest

        ports:
        - containerPort: 3000

