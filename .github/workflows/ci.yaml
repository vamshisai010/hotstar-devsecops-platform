name: SecureFlow-CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: hotstar-devsecops-platform

jobs:

  build-scan-push:

    runs-on: ubuntu-latest

    steps:

    # Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup NodeJS
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Install Dependencies
    - name: Install Dependencies
      run: npm install

    # Build Application
    - name: Build React Application
      run: npm run build

    # SonarQube Scan
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # DockerHub Login
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker Image
    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:${{ github.run_number }} .

    # Trivy Vulnerability Scan
    - name: Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:${{ github.run_number }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # Push Docker Image
    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.DOCKER_USERNAME }}/hotstar-devsecops-platform:${{ github.run_number }}

    # Save Image Tag
    - name: Save Image Tag
      run: |
        echo "${{ github.run_number }}" > image-tag.txt

    # Upload Artifact
    - name: Upload Image Tag
      uses: actions/upload-artifact@v4
      with:
        name: image-tag
        path: image-tag.txt
